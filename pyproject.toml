[project]
name = "ragx"              
version = "0.1.0"         
requires-python = ">=3.12" 
dependencies = [
    "aiofiles>=25.1.0",
    "alembic>=1.18.5",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.140.0",
    "greenlet>=3.5.4",
    "pydantic-settings>=2.14.2",
    "pydantic[email]>=2.13.4",
    "pyjwt>=2.13.0",
    "pymupdf>=1.28.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "structlog>=26.1.0",
    "uuid-utils>=0.17.0",
    "uvicorn[standard]>=0.51.0",
]         

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.9.1",
    "mypy",
    "pytest",
    "ruff",
    "types-aiofiles>=25.1.0.20260518",
] 

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragx"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "T20", "RUF"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]  # generated migration code; long lines are normal

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["ragx"]
pretty = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
  module = "pymupdf"
  ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not integration'"
markers = [
    "integration: requires real infrastructure (database, network)",
]
